<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - MOHAN'S VISION</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 20px;
            background: #1e293b;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #cbd5e1;
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to MOHAN'S VISION</h1>

        <p>
            Complete your profile setup to continue.
        </p>

        <form method="GET"action="/login">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >

            <button type="submit">
                Continue
            </button>
        </form>
    </div>
</body>
</html>
