<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MOHAN'S VISION</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 430px;
            padding: 35px;
            border-radius: 20px;
            background: #1e293b;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .signup {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>MOHAN'S VISION</h1>

    <p>Login to continue</p>

    <form method="POST" action="/login">

        <input type="hidden" name="mode" value="login">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
        >

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
